name = "sutra-lounge"
main = "dist/index.html"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Configure asset caching for Cloudflare Pages
[build]
command = "npm run build"
cwd = "."

# Static assets caching policy
[[env.production.routes]]
pattern = "/assets/*"
zone_id = ""
custom_domain = false

# Route all requests to index.html for SPA routing
[[routes]]
pattern = "/*"
zone_id = ""

[env.production]
routes = []
