name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - v0/table-booking-with-whatsapp-6d7a8b4b
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'
  NPM_CI: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT: production

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build output size: $(du -sh dist | cut -f1)"
          ls -lh dist/

      - name: Verify assets
        run: |
          echo "Checking for critical files..."
          [ -f "dist/index.html" ] && echo "✓ index.html found" || exit 1
          [ -d "dist/assets" ] && echo "✓ assets directory found" || exit 1
          [ -d "dist/images" ] && echo "✓ images directory found" || exit 1
          echo "All critical files verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v0/table-booking-with-whatsapp-6d7a8b4b')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler CLI
        run: npm install -g wrangler@latest

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT: production

      - name: Deploy to Cloudflare Pages
        run: wrangler pages publish dist --project-name=sutra-lounge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.job.status;
            const message = status === 'success' 
              ? '✅ Deployed to Cloudflare Pages'
              : '❌ Deployment failed';
            
            console.log(message);

  performance:
    name: Performance Check
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Check bundle size
        run: |
          DIST_SIZE=$(du -sh dist | cut -f1)
          MAIN_BUNDLE=$(ls -lh dist/assets/index-*.js | awk '{print $5}')
          
          echo "📦 Build Statistics"
          echo "Total size: $DIST_SIZE"
          echo "Main bundle: $MAIN_BUNDLE"
          
          # Check if main bundle exceeds threshold (500KB)
          MAIN_SIZE_KB=$(stat -c%s dist/assets/index-*.js 2>/dev/null | xargs -I {} sh -c 'echo $(({}/ 1024))')
          if [ "$MAIN_SIZE_KB" -gt 500 ]; then
            echo "⚠️  Warning: Main bundle exceeds 500KB ($MAIN_SIZE_KB KB)"
          else
            echo "✅ Bundle size OK ($MAIN_SIZE_KB KB)"
          fi

  security:
    name: Security Check
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        run: |
          echo "Checking for exposed secrets..."
          ! grep -r "SUPABASE_ANON_KEY\|CLOUDFLARE_API_TOKEN" dist/
          echo "✅ No exposed secrets found"
