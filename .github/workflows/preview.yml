name: Preview Deployment

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENVIRONMENT: preview

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          OUTPUT=$(wrangler pages publish dist --project-name=sutra-lounge-preview 2>&1)
          echo "$OUTPUT"
          
          # Extract preview URL from output
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | head -1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Comment PR with preview link
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready\n\n[View Preview](${previewUrl})\n\n- Build Status: ✅ Success\n- Bundle Size: Check workflow logs\n- Live Preview: [Link](${previewUrl})`
            });

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: preview-dist
          path: dist/
          retention-days: 7
